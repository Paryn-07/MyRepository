<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | อนาคตแห่งโลกดิจิทัล</title>
    <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ตั้งค่าพื้นฐาน */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* พื้นหลังเคลื่อนไหวแบบ Gradient */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 10s infinite alternate;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: #ec4899;
            bottom: 20%;
            left: 20%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* แถบนำทาง (Navbar) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(to right, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 300;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #a78bfa;
        }

        /* ส่วนเนื้อหาหลัก (Hero Section) */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 90px);
            padding: 2rem 5%;
            perspective: 1000px; /* สำหรับ 3D Effect */
        }

        /* ดีไซน์ Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 4rem;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .glass-card h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            transform: translateZ(50px); /* 3D pop out */
        }

        .glass-card p {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 2.5rem;
            font-weight: 300;
            transform: translateZ(30px);
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s;
            transform: translateZ(40px);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            box-shadow: 0 10px 20px -10px rgba(168, 85, 247, 0.7);
        }

        .btn-primary:hover {
            transform: translateZ(40px) translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(168, 85, 247, 0.9);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-left: 1rem;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateZ(40px) translateY(-3px);
        }

        /* ตอบสนองหน้าจอมือถือ */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* ซ่อนเมนูบนมือถือเพื่อความเรียบง่าย */
            }
            .glass-card {
                padding: 2rem;
            }
            .glass-card h1 {
                font-size: 2.2rem;
            }
            .btn {
                display: block;
                margin: 1rem 0 0 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- พื้นหลังสีสันเคลื่อนไหว -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- แถบนำทาง -->
    <nav>
        <div class="logo">AURA.</div>
        <div class="nav-links">
            <a href="#">หน้าแรก</a>
            <a href="#">ฟีเจอร์</a>
            <a href="#">ผลงาน</a>
            <a href="#">ติดต่อเรา</a>
        </div>
    </nav>

    <!-- เนื้อหาหลัก -->
    <section class="hero">
        <div class="glass-card" id="tilt-card">
            <h1>ก้าวข้ามขีดจำกัด<br>ของงานดีไซน์</h1>
            <p>สัมผัสประสบการณ์ดิจิทัลเหนือระดับ ด้วยการออกแบบที่ผสานเทคโนโลยีและศิลปะเข้าด้วยกันอย่างลงตัว ลองขยับเมาส์ไปมาบนการ์ดนี้สิ!</p>
            <div>
                <a href="#" class="btn btn-primary">เริ่มต้นใช้งาน</a>
                <a href="#" class="btn btn-outline">ดูวิดีโอสาธิต</a>
            </div>
        </div>
    </section>

    <!-- สคริปต์สำหรับเอฟเฟกต์ 3D Tilt -->
    <script>
        const card = document.getElementById('tilt-card');

        // เมื่อเมาส์ขยับบนการ์ด
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left; // ตำแหน่ง X ของเมาส์ในตารางการ์ด
            const y = e.clientY - rect.top;  // ตำแหน่ง Y ของเมาส์ในตารางการ์ด
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // คำนวณมุมการเอียง (ยิ่งห่างจากตรงกลางยิ่งเอียงมาก)
            const rotateX = ((y - centerY) / centerY) * -10; // เอียงสูงสุด 10 องศา
            const rotateY = ((x - centerX) / centerX) * 10;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // เมื่อเมาส์ออกจากการ์ด ให้กลับคืนสภาพเดิม
        card.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            card.style.transition = `transform 0.5s ease-out`;
        });

        // เมื่อเมาส์เข้ามาในการ์ด ยกเลิก transition เพื่อให้ขยับตามเมาส์ได้ทันที
        card.addEventListener('mouseenter', () => {
            card.style.transition = `none`;
        });
    </script>
</body>
</html>
